<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product যোগ করুন</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#f5f7fb;color:#172033;
  font-family:Arial,"Noto Sans Bengali",sans-serif;padding:24px
}
.product-board{
  max-width:900px;margin:auto;background:#fff;border:1px solid #d9e1ea;
  border-radius:14px;padding:22px;box-shadow:0 5px 20px rgba(0,0,0,.06)
}
.header{
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid #e5e9ef;padding-bottom:16px;margin-bottom:20px
}
.header h2{margin:0;font-size:23px}
.close{border:0;background:none;font-size:25px;cursor:pointer}
.section{
  border:1px solid #dbe3eb;border-radius:10px;padding:17px;margin-bottom:16px
}
.section h3{margin:0 0 14px;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}
input,select,textarea{
  width:100%;border:1px solid #cbd5e1;border-radius:7px;
  padding:11px 12px;font-size:14px;background:#fff;outline:none
}
input:focus,select:focus,textarea:focus{border-color:#0a9f6e;box-shadow:0 0 0 2px rgba(10,159,110,.12)}
textarea{min-height:100px;resize:vertical}
.hint{font-size:12px;color:#64748b;margin-top:5px}
.price-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.upload{
  border:2px dashed #b9d7ca;background:#f7fffb;border-radius:9px;
  padding:18px;text-align:center
}
.upload input{border:0;padding:5px}
.preview{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.preview img{width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid #d5dde5}
.tags{
  color:#64748b;background:#f8fafc
}
.checks{display:flex;gap:25px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:7px;font-weight:600}
.check input{width:auto}
.footer{
  display:flex;justify-content:flex-end;gap:10px;border-top:1px solid #e5e9ef;
  padding-top:17px;margin-top:5px
}
button{
  border:0;border-radius:7px;padding:11px 20px;font-weight:700;cursor:pointer
}
.cancel{background:#e9eef4;color:#172033}
.save{background:#0a9f6e;color:white}
.save:hover{background:#07865d}
.slug{background:#f8fafc}
@media(max-width:650px){
  body{padding:8px}.product-board{padding:14px}
  .grid,.price-row{grid-template-columns:1fr}
  .full{grid-column:auto}
}
</style>
</head>
<body>

<div class="product-board">
  <div class="header">
    <h2>🛍️ Product যোগ করুন</h2>
    <button class="close" type="button">×</button>
  </div>

  <div class="section">
    <h3>📌 Product Information</h3>
    <div class="grid">
      <div>
        <label>Product Name *</label>
        <input id="productName" placeholder="যেমন: 3D Waterproof Bed Sheet" required>
      </div>

      <div>
        <label>Slug</label>
        <input id="productSlug" class="slug" placeholder="অটোমেটিক তৈরি হবে" readonly>
        <div class="hint">Product Name লিখলেই Slug তৈরি হবে</div>
      </div>

      <div>
        <label>Category *</label>
        <select>
          <option>Category নির্বাচন করুন</option>
          <option>পর্দি ও জানালার পোশাক</option>
          <option>গাউন</option>
          <option>টি-শার্ট</option>
          <option>শি-পিস</option>
          <option>অন্যান্য</option>
          <option>শাড়ি</option>
        </select>
      </div>

      <div>
        <label>Stock</label>
        <input type="number" min="0" value="0" placeholder="0">
      </div>
    </div>
  </div>

  <div class="section">
    <h3>🖼️ Product Images</h3>
    <div class="upload">
      <label>প্রধান ছবি</label>
      <input id="mainImage" type="file" accept="image/*">
      <div class="hint">JPG, PNG, WEBP — সরাসরি ছবি Upload করা যাবে</div>
      <div id="mainPreview" class="preview"></div>
    </div>

    <div style="height:12px"></div>

    <div class="upload">
      <label>Gallery Images</label>
      <input id="galleryImages" type="file" accept="image/*" multiple>
      <div class="hint">একসাথে একাধিক ছবি নির্বাচন করুন</div>
      <div id="galleryPreview" class="preview"></div>
    </div>
  </div>

  <div class="section">
    <h3>📝 Product Details</h3>
    <div class="grid">
      <div class="full">
        <label>Description</label>
        <textarea placeholder="পণ্যের বিস্তারিত লিখুন..."></textarea>
      </div>

      <div>
        <label>Sizes</label>
        <input class="tags" placeholder="যেমন: S, M, L, XL">
        <div class="hint">আপনার পণ্যের সাইজগুলো কমা দিয়ে লিখুন</div>
      </div>

      <div>
        <label>Colors</label>
        <input class="tags" placeholder="যেমন: লাল, নীল, কালো">
        <div class="hint">রংগুলো কমা দিয়ে লিখুন</div>
      </div>
    </div>
  </div>

  <div class="section">
    <h3>💰 Price</h3>
    <div class="price-row">
      <div>
        <label>পুরাতন দাম</label>
        <input type="number" min="0" placeholder="0">
      </div>
      <div>
        <label>বিক্রির দাম *</label>
        <input type="number" min="0" placeholder="0" required>
      </div>
      <div>
        <label>Discount (%)</label>
        <input type="number" min="0" max="100" value="0">
      </div>
    </div>
  </div>

  <div class="section">
    <h3>⚙️ Product Status</h3>
    <div class="checks">
      <label class="check"><input type="checkbox"> Featured Product</label>
      <label class="check"><input type="checkbox"> Trending Product</label>
      <label class="check"><input type="checkbox" checked> Active</label>
    </div>
  </div>

  <div class="footer">
    <button class="cancel" type="button">Cancel</button>
    <button class="save" type="button">💾 Save Product</button>
  </div>
</div>

<script>
const nameInput = document.getElementById("productName");
const slugInput = document.getElementById("productSlug");

nameInput.addEventListener("input", () => {
  const value = nameInput.value.trim().toLowerCase();
  slugInput.value = value
    .replace(/[^a-z0-9\s-]/g, "")
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");
});

function previewFiles(input, target, multiple=false){
  input.addEventListener("change", () => {
    target.innerHTML = "";
    const files = multiple ? [...input.files] : [...input.files].slice(0,1);
    files.forEach(file => {
      if(!file.type.startsWith("image/")) return;
      const img = document.createElement("img");
      img.src = URL.createObjectURL(file);
      img.onload = () => URL.revokeObjectURL(img.src);
      target.appendChild(img);
    });
  });
}
previewFiles(document.getElementById("mainImage"), document.getElementById("mainPreview"));
previewFiles(document.getElementById("galleryImages"), document.getElementById("galleryPreview"), true);
</script>
</body>
</html>
